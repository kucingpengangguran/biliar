<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola Multiplayer</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #1a1a1a;
            font-family: Arial, sans-serif; display: flex;
            justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; user-select: none;
        }
        .game-container {
            position: relative; width: 400px; height: 750px;
            background: #2b4a36; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden;
        }
        .ai-hand-area {
            position: absolute; top: 15px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 8px; height: 65px;
        }
        .card-back {
            width: 45px; height: 65px;
            background: repeating-linear-gradient(45deg, #444, #444 4px, #666 4px, #666 8px);
            border-radius: 4px; border: 1px solid #333;
        }
        .center-board {
            position: absolute; top: 90px; left: 15px; right: 15px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .info-row {
            display: flex; justify-content: space-between; width: 100%; align-items: center; padding: 0 10px;
        }
        .turn-counter, .message-box {
            color: #ffeb3b; font-size: 12px; font-weight: bold;
            background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 4px; text-align: center;
        }
        .briscola-text-wrapper {
            display: flex; align-items: center; gap: 6px; color: #ffeb3b; font-size: 12px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 4px;
        }
        .briscola-mini-card {
            width: 30px; height: 42px; background: white; border-radius: 3px; display: flex; flex-direction: column; justify-content: space-between; padding: 2px; font-size: 9px; font-weight: bold;
        }
        .table-area {
            position: absolute; top: 195px; left: 15px; right: 15px; height: 220px;
            display: flex; gap: 15px; justify-content: center; align-items: center;
            border: 2px dashed rgba(255,255,255,0.15); border-radius: 8px;
        }
        .turn-winner-popup {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); color: #ffeb3b; padding: 10px 20px;
            border-radius: 8px; font-size: 18px; font-weight: bold; z-index: 50;
            display: none; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card {
            width: 65px; height: 95px; background: white; border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column;
            justify-content: space-between; padding: 5px; font-weight: bold; font-size: 13px; position: relative;
        }
        .red { color: #d32f2f; }
        .black { color: #111; }
        .player-hand {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 10px; height: 110px;
        }
        .player-hand .card { width: 75px; height: 105px; font-size: 14px; cursor: pointer; }
        .card.throw-to-corner {
            transform: translate(120px, -180px) scale(0.25) rotate(35deg) !important;
            opacity: 0 !important;
            transition: transform 0.6s ease, opacity 0.6s ease !important;
        }
        .modal {
            display: flex; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); color: white; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; text-align: center; gap: 10px;
        }
        .modal input { padding: 10px; border-radius: 4px; border: none; width: 200px; text-align: center; font-size: 16px; font-weight: bold; }
        .modal button { background: #ffeb3b; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="ai-hand-area" id="opponent-hand-area">
        <div class="card-back"></div><div class="card-back"></div><div class="card-back"></div>
    </div>
    
    <div class="center-board">
        <div class="info-row">
            <div class="turn-counter" id="turn-counter-text">Turn: 1/20</div>
            <div class="briscola-text-wrapper">
                <span>Briscola:</span>
                <div class="briscola-mini-card" id="briscola-mini-card"></div>
            </div>
        </div>
        <div class="message-box" id="message-box">Memulai permainan...</div>
    </div>

    <div class="turn-winner-popup" id="turn-winner-popup">You Won!</div>
    <div class="table-area" id="table-area"></div>
    <div class="player-hand" id="player-hand"></div>

    <div class="modal" id="lobby-modal">
        <h2 style="color: #ffeb3b; margin: 0;" id="modal-title">Briscola Room</h2>
        <p id="lobby-status" style="margin: 0; font-size: 14px;">Masukkan kode room untuk mabar</p>
        <input type="text" id="room-code-input" placeholder="Cth: mabar123">
        <button id="join-btn" onclick="joinRoomCode()">Masuk Room</button>
    </div>
</div>

<script>
    // LINK ZROK KAMU TERPASANG DI SINI
    const BACKEND_URL = 'https://70737k45ofyi.share.zrok.io';
    const socket = io(BACKEND_URL);
    
    let myHand = [];
    let briscolaCard = null;
    let myTurn = false;

    function joinRoomCode() {
        const code = document.getElementById('room-code-input').value.trim();
        if (!code) {
            alert('Kode room tidak boleh kosong!');
            return;
        }
        document.getElementById('join-btn').style.display = 'none';
        document.getElementById('room-code-input').style.display = 'none';
        document.getElementById('lobby-status').innerText = 'Menghubungkan ke room...';
        socket.emit('join_room', code);
    }

    socket.on('waiting', (msg) => {
        document.getElementById('lobby-status').innerText = msg;
    });

    socket.on('game_start', (data) => {
        myHand = data.hand;
        briscolaCard = data.briscola;
        myTurn = (data.turn === socket.id);

        document.getElementById('lobby-modal').style.display = 'none';
        updateUI();
        updateTurnStatus(data.turn);
        updateRoundText(data.round || 1);
    });

    socket.on('update_turn', (data) => {
        myTurn = (data.turn === socket.id);
        updateTurnStatus(data.turn);
    });

    socket.on('card_played', ({ socketId, card, handCount }) => {
        const tableArea = document.getElementById('table-area');
        const cardEl = renderCardElement(card);
        tableArea.appendChild(cardEl);

        if (socketId !== socket.id) {
            const oppArea = document.getElementById('opponent-hand-area');
            oppArea.innerHTML = '';
            for(let i = 0; i < handCount; i++) {
                oppArea.appendChild(document.createElement('div')).className = 'card-back';
            }
        }
    });

    socket.on('turn_resolved', ({ winnerId, hands, nextTurn, round, scores, isGameOver, finalWinner }) => {
        const popup = document.getElementById('turn-winner-popup');
        if (winnerId === socket.id) {
            popup.innerText = "You Won this Turn!";
        } else {
            popup.innerText = "Opponent Won Turn!";
        }
        popup.style.display = 'block';

        document.getElementById('table-area').querySelectorAll('.card').forEach(el => {
            el.classList.add('throw-to-corner');
        });

        setTimeout(() => {
            document.getElementById('table-area').innerHTML = '';
            popup.style.display = 'none';
            
            myHand = hands[socket.id] || [];
            myTurn = (nextTurn === socket.id);
            updateUI();
            updateTurnStatus(nextTurn);
            updateRoundText(round);

            if (isGameOver) {
                const statusMenang = (finalWinner === socket.id) ? "MENANG! 🎉" : "KALAH! 😢";
                document.getElementById('modal-title').innerText = "Permainan Selesai!";
                document.getElementById('lobby-modal').style.display = 'flex';
                document.getElementById('lobby-status').innerHTML = `Kamu <b>${statusMenang}</b><br>Skor Akhir Kamu: <b>${scores[socket.id]}</b>`;
                document.getElementById('room-code-input').style.display = 'none';
                document.getElementById('join-btn').style.display = 'block';
                document.getElementById('join-btn').innerText = 'Main Lagi';
            }
        }, 1000);
    });

    function playCard(index) {
        if (!myTurn || document.getElementById('table-area').children.length >= 2) return;
        
        myHand.splice(index, 1);
        updateUI();
        myTurn = false;
        document.getElementById('message-box').innerText = "Menunggu lawan...";

        socket.emit('play_card', { cardIndex: index });
    }

    function updateUI() {
        const handArea = document.getElementById('player-hand');
        handArea.innerHTML = '';
        myHand.forEach((card, index) => {
            const cardEl = renderCardElement(card);
            cardEl.onclick = () => playCard(index);
            handArea.appendChild(cardEl);
        });

        if (briscolaCard) {
            const mini = document.getElementById('briscola-mini-card');
            mini.className = `briscola-mini-card ${briscolaCard.color}`;
            mini.innerHTML = `<div>${briscolaCard.val}${briscolaCard.symbol}</div><div style="text-align:center">${briscolaCard.symbol}</div><div style="transform:rotate(180deg);align-self:flex-end">${briscolaCard.val}${briscolaCard.symbol}</div>`;
        }
    }

    function renderCardElement(card) {
        const el = document.createElement('div');
        el.className = `card ${card.color}`;
        el.innerHTML = `<div>${card.val}${card.symbol}</div><div style="text-align: center; font-size: 20px;">${card.symbol}</div><div style="transform: rotate(180deg); align-self: flex-end;">${card.val}${card.symbol}</div>`;
        return el;
    }

    function updateTurnStatus(turnId) {
        const isMe = (turnId === socket.id);
        document.getElementById('message-box').innerText = isMe ? "Giliranmu!" : "Giliran Lawan...";
    }

    function updateRoundText(roundNum) {
        document.getElementById('turn-counter-text').innerText = `Turn: ${roundNum}/20`;
    }
</script>

</body>
</html>
