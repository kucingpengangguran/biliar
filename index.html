<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background: #2b4a36; color: white; text-align: center; font-family: sans-serif; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card { display: inline-block; width: 50px; height: 70px; background: white; color: black; margin: 5px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="game-ui">
        <h3 id="turn-text">Menunggu...</h3>
        <div id="table"></div>
        <div id="hand"></div>
    </div>

    <div class="modal" id="lobby">
        <h2>Briscola</h2>
        <input id="code" placeholder="Kode Room">
        <button onclick="join()">Mulai</button>
    </div>

    <script>
        const socket = io();
        function join() { socket.emit('join_room', document.getElementById('code').value); }
        
        socket.on('game_start', (d) => { document.getElementById('lobby').style.display = 'none'; renderHand(d.hand); });
        
        socket.on('turn_resolved', (d) => {
            if (d.isGameOver) {
                const winner = d.finalWinner === socket.id ? "MENANG!" : "KALAH!";
                alert("Game Selesai! Kamu " + winner + "\nSkor Akhir: " + d.scores[socket.id]);
                location.reload();
            }
        });

        function renderHand(hand) {
            const h = document.getElementById('hand');
            h.innerHTML = '';
            hand.forEach((c, i) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerText = c.val + c.symbol;
                el.onclick = () => socket.emit('play_card', { cardIndex: i });
                h.appendChild(el);
            });
        }
    </script>
</body>
</html>
