<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briscola - Layout Final</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            position: relative;
            width: 400px;
            height: 750px;
            background: #2b4a36;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding: 12px;
        }

        /* Tombol Musik Backsound di Pojok Atas */
        .music-control {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffeb3b;
            border: 1px solid #ffeb3b;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 50;
            outline: none;
        }

        /* Area Kartu Lawan (AI di Atas) */
        .ai-hand-area {
            display: flex;
            justify-content: center;
            gap: 8px;
            height: 55px;
            margin-bottom: 6px;
        }

        .card-back {
            width: 38px;
            height: 55px;
            background: repeating-linear-gradient(45deg, #444, #444 4px, #666 4px, #666 8px);
            border-radius: 4px;
            border: 1px solid #333;
        }

        /* Kotak Pesan */
        .message-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: #ffeb3b;
            padding: 5px 8px;
            text-align: center;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            box-sizing: border-box;
            min-height: 22px;
            margin-bottom: 6px;
        }

        /* Baris Turn & Briscola di Luar Meja (Atas Meja) */
        .external-top-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .turn-counter {
            color: #ffeb3b;
            font-size: 11px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 4px 10px;
            border-radius: 4px;
        }

        /* Area Meja Pertarungan Kartu di Tengah-Tengah */
        .table-area {
            width: 100%;
            height: 220px;
            background: rgba(0, 0, 0, 0.22);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            box-sizing: border-box;
            position: relative;
            margin-bottom: 8px;
            gap: 10px;
        }

        /* Kartu Briscola di Kiri Tengah, setengah tertutup deck */
        .table-briscola-slot {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            z-index: 5;
        }

        /* Teks Indikator Briscola */
        .briscola-label-container {
            position: absolute;
            top: -18px;
            left: 0;
            font-size: 9px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .briscola-mini-card {
            width: 38px;
            height: 55px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3px;
            font-size: 9px;
            font-weight: bold;
            border: 1px solid #ccc;
            position: relative;
        }

        /* Tumpukan dek yang menutupi setengah kartu briscola */
        .briscola-deck-cover {
            width: 38px;
            height: 55px;
            background: repeating-linear-gradient(45deg, #444, #444 4px, #666 4px, #666 8px);
            border-radius: 4px;
            border: 1px solid #333;
            position: relative;
            left: -18px;
            z-index: 6;
        }

        /* Efek Teks "YOU WON" di Tengah Meja */
        .you-won-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: rgba(255, 235, 59, 0.95);
            color: #1a1a1a;
            padding: 6px 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .you-won-banner.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Desain Kartu Utama */
        .card {
            width: 56px;
            height: 80px;
            background: linear-gradient(135deg, #ffffff 0%, #f7f7f7 100%);
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            font-weight: bold;
            font-size: 11px;
            position: relative;
            z-index: 5;
            border: 1px solid #cfcfcf;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-inner-art {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            opacity: 0.9;
        }

        .red { color: #d32f2f; }
        .black { color: #111; }

        /* Area Tangan Pemain */
        .player-hand-container {
            position: relative;
            width: 100%;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 5px;
        }

        .player-hand {
            display: flex;
            justify-content: center;
            gap: 10px;
            height: 90px;
            width: 100%;
            position: relative;
            z-index: 3;
        }

        .player-hand .card {
            width: 62px;
            height: 90px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .player-hand .card .card-inner-art {
            font-size: 26px;
        }

        /* Animasi Lembar Kartu */
        .card.fly-from-player {
            animation: playerThrowAnim 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes playerThrowAnim {
            0% { transform: translateY(110px) scale(0.9); opacity: 0.5; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }

        .card.fly-from-ai {
            animation: aiThrowAnim 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes aiThrowAnim {
            0% { transform: translateY(-110px) scale(0.9); opacity: 0.5; }
            100% { transform: translateY(0px) scale(1); opacity: 1; }
        }

        /* Efek Kartu Kesedot & Memudar (Vacuum/Warp) */
        .card.throw-to-corner {
            transition: all 0.4s cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
            transform: translate(-140px, -70px) scale(0.1) rotate(-90deg) !important;
            filter: blur(4px);
            opacity: 0 !important;
            z-index: 20;
        }

        /* Modal Skor Akhir */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
            text-align: center;
        }

        .modal h2 { color: #ffeb3b; margin-top: 0; }
        .modal button {
            background: #ffeb3b;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Tombol Kontrol Musik Backsound -->
    <button class="music-control" id="music-btn" onclick="toggleMusic()">🔊</button>

    <!-- Elemen Audio -->
    <audio id="bg-music" loop>
        <source src="monolog.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung pemutar audio.
    </audio>

    <!-- Tangan AI (Tertutup) -->
    <div class="ai-hand-area" id="ai-hand-area">
        <div class="card-back"></div>
        <div class="card-back"></div>
        <div class="card-back"></div>
    </div>

    <!-- Kotak Pesan -->
    <div class="message-box" id="message-box"></div>

    <!-- Turn & Briscola di Luar Meja (Bagian Atas) -->
    <div class="external-top-info">
        <div class="turn-counter" id="turn-counter-text">Turn: 1 / 20</div>
    </div>

    <!-- Area Meja Pertarungan Kartu -->
    <div class="table-area" id="table-area">
        <div class="table-briscola-slot">
            <div class="briscola-label-container">BRISCOLA</div>
            <div class="briscola-mini-card" id="briscola-mini-card"></div>
            <div class="briscola-deck-cover"></div>
        </div>

        <div class="you-won-banner" id="you-won-banner">YOU WON!</div>
    </div>

    <!-- Area Tangan Pemain -->
    <div class="player-hand-container">
        <div class="player-hand" id="player-hand"></div>
    </div>

    <!-- Modal Skor Akhir -->
    <div class="modal" id="score-modal">
        <h2>Permainan Selesai!</h2>
        <div id="score-details" style="font-size: 13px; line-height: 1.5; text-align: left; margin-bottom: 10px;"></div>
        <button onclick="initGame()">Main Lagi</button>
    </div>
</div>

<script>
    const suits = [
        { id: 'D', symbol: '♦', color: 'red' },
        { id: 'C', symbol: '♥', color: 'red' },
        { id: 'S', symbol: '♠', color: 'black' },
        { id: 'B', symbol: '♣', color: 'black' }
    ];

    const cardData = {
        'A': { power: 13, points: 11 },
        '3': { power: 12, points: 10 },
        'K': { power: 10, points: 4 },
        'Q': { power: 9, points: 3 },
        'J': { power: 8, points: 2 },
        '7': { power: 7, points: 0 },
        '6': { power: 6, points: 0 },
        '5': { power: 5, points: 0 },
        '4': { power: 4, points: 0 },
        '2': { power: 2, points: 0 }
    };

    let deck = [], playerHand = [], aiHand = [], tableCards = [];
    let playerPile = [], aiPile = [];
    let briscolaCard = null;
    let isPlayerTurn = true;
    let playedThisTurn = [];
    let currentTurnNumber = 1;
    const totalTurns = 20;

    let isMusicPlaying = false;

    function toggleMusic() {
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('music-btn');
        if (music.paused) {
            music.play().then(() => {
                btn.innerText = "🔊";
                isMusicPlaying = true;
            }).catch(e => {
                console.log("Gagal memutar audio:", e);
            });
        } else {
            music.pause();
            btn.innerText = "🔇";
            isMusicPlaying = false;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('music-btn');
        
        music.play().then(() => {
            btn.innerText = "🔊";
            isMusicPlaying = true;
        }).catch(e => {
            console.log("Autoplay dicegah browser, menunggu interaksi pertama.");
        });
    });

    function triggerAutoPlayMusic() {
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('music-btn');
        if (!isMusicPlaying) {
            music.play().then(() => {
                btn.innerText = "🔊";
                isMusicPlaying = true;
                window.removeEventListener('click', triggerAutoPlayMusic);
                window.removeEventListener('touchstart', triggerAutoPlayMusic);
            }).catch(e => {
                console.log("Menunggu interaksi pengguna:", e);
            });
        }
    }

    window.addEventListener('click', triggerAutoPlayMusic);
    window.addEventListener('touchstart', triggerAutoPlayMusic);

    function createDeck() {
        let d = [];
        suits.forEach(suit => {
            Object.keys(cardData).forEach(val => {
                d.push({
                    suit: suit.id,
                    symbol: suit.symbol,
                    color: suit.color,
                    val: val,
                    power: cardData[val].power,
                    points: cardData[val].points
                });
            });
        });
        return shuffle(d);
    }

    function shuffle(array) {
        for (let pass = 0; pass < 4; pass++) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        return array;
    }

    function initGame() {
        deck = createDeck();
        playerHand = deck.splice(0, 3);
        aiHand = deck.splice(0, 3);
        briscolaCard = deck.pop();
        deck.unshift(briscolaCard);

        tableCards = [];
        playerPile = [];
        aiPile = [];
        playedThisTurn = [];
        currentTurnNumber = 1;
        isPlayerTurn = Math.random() < 0.5;

        document.getElementById('score-modal').style.display = 'none';
        updateUI();
        
        if (!isPlayerTurn) {
            setMessage("");
            setTimeout(runAITurn, 1000);
        } else {
            setMessage("Giliranmu");
        }
    }

    function updateUI() {
        const aiArea = document.getElementById('ai-hand-area');
        aiArea.innerHTML = '';
        for (let i = 0; i < aiHand.length; i++) {
            aiArea.appendChild(document.createElement('div')).className = 'card-back';
        }

        const miniCardEl = document.getElementById('briscola-mini-card');
        miniCardEl.className = `briscola-mini-card ${briscolaCard.color}`;
        miniCardEl.innerHTML = `
            <div>${briscolaCard.val}${briscolaCard.symbol}</div>
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px;">${briscolaCard.symbol}</div>
            <div style="transform: rotate(180deg); align-self: flex-end;">${briscolaCard.val}${briscolaCard.symbol}</div>
        `;

        document.getElementById('turn-counter-text').innerText = `Turn: ${currentTurnNumber} / ${totalTurns}`;

        const handArea = document.getElementById('player-hand');
        handArea.innerHTML = '';
        playerHand.forEach((card, index) => {
            const cardEl = renderCardElement(card);
            cardEl.onclick = () => playPlayerCard(index);
            handArea.appendChild(cardEl);
        });
    }

    function renderCardElement(card) {
        const el = document.createElement('div');
        el.className = `card ${card.color}`;
        el.innerHTML = `
            <div>${card.val}${card.symbol}</div>
            <div class="card-inner-art">${card.symbol}</div>
            <div style="transform: rotate(180deg); align-self: flex-end;">${card.val}${card.symbol}</div>
        `;
        return el;
    }

    function playPlayerCard(index) {
        if (!isPlayerTurn || playedThisTurn.length >= 2) return;

        const card = playerHand.splice(index, 1)[0];
        isPlayerTurn = false;

        updateUI();

        const tableArea = document.getElementById('table-area');
        const cardEl = renderCardElement(card);
        cardEl.classList.add('fly-from-player');
        tableArea.appendChild(cardEl);

        setMessage("");
        playedThisTurn.push({ card: card, owner: 'player', element: cardEl });

        setTimeout(() => {
            if (playedThisTurn.length === 2) {
                resolveTurn();
            } else {
                setTimeout(runAITurn, 800);
            }
        }, 450);
    }

    function getAIMove() {
        if (aiHand.length === 0) return 0;

        if (playedThisTurn.length === 0) {
            let zeroPtCards = aiHand.map((c, idx) => ({ c, idx })).filter(item => item.c.points === 0);
            if (zeroPtCards.length > 0) {
                zeroPtCards.sort((a, b) => a.c.power - b.c.power);
                return zeroPtCards[0].idx;
            }
            let sorted = aiHand.map((c, idx) => ({ c, idx })).sort((a, b) => a.c.power - b.c.power);
            return sorted[0].idx;
        } else {
            const leadCard = playedThisTurn[0].card;
            const isBriscolaSuit = (c) => c.suit === briscolaCard.suit;

            let winningOptions = [];
            aiHand.forEach((c, idx) => {
                let wins = false;
                if (isBriscolaSuit(c) && !isBriscolaSuit(leadCard)) {
                    wins = true;
                } else if (!isBriscolaSuit(c) && isBriscolaSuit(leadCard)) {
                    wins = false;
                } else if (isBriscolaSuit(c) && isBriscolaSuit(leadCard)) {
                    if (c.power > leadCard.power) wins = true;
                } else {
                    if (c.suit === leadCard.suit && c.power > leadCard.power) {
                        wins = true;
                    }
                }
                if (wins) {
                    winningOptions.push({ c, idx });
                }
            });

            if (winningOptions.length > 0) {
                if (leadCard.points > 0 || currentTurnNumber > 15) {
                    winningOptions.sort((a, b) => a.c.power - b.c.power);
                    return winningOptions[0].idx;
                } else {
                    let losingOptions = aiHand.map((c, idx) => ({ c, idx })).filter(item => !winningOptions.some(w => w.idx === item.idx));
                    if (losingOptions.length > 0) {
                        losingOptions.sort((a, b) => a.c.points - b.c.points || a.c.power - b.c.power);
                        return losingOptions[0].idx;
                    } else {
                        winningOptions.sort((a, b) => a.c.power - b.c.power);
                        return winningOptions[0].idx;
                    }
                }
            } else {
                let sorted = aiHand.map((c, idx) => ({ c, idx })).sort((a, b) => a.c.points - b.c.points || a.c.power - b.c.power);
                return sorted[0].idx;
            }
        }
    }

    function runAITurn() {
        if (aiHand.length === 0 || playedThisTurn.length >= 2) return;

        let chosenIdx = getAIMove();
        const card = aiHand.splice(chosenIdx, 1)[0];

        const tableArea = document.getElementById('table-area');
        const cardEl = renderCardElement(card);
        cardEl.classList.add('fly-from-ai');
        tableArea.appendChild(cardEl);

        setMessage("");
        playedThisTurn.push({ card: card, owner: 'ai', element: cardEl });

        setTimeout(() => {
            if (playedThisTurn.length === 2) {
                resolveTurn();
            } else {
                isPlayerTurn = true;
                setMessage("Giliranmu");
            }
        }, 450);

        updateUIOnly();
    }

    function updateUIOnly() {
        const aiArea = document.getElementById('ai-hand-area');
        aiArea.innerHTML = '';
        for (let i = 0; i < aiHand.length; i++) {
            aiArea.appendChild(document.createElement('div')).className = 'card-back';
        }
        document.getElementById('turn-counter-text').innerText = `Turn: ${currentTurnNumber} / ${totalTurns}`;
    }

    function resolveTurn() {
        const first = playedThisTurn[0];
        const second = playedThisTurn.length > 1 ? playedThisTurn[1] : null;
        if (!second) return;
        let winnerOwner = '';

        const isBriscola = (c) => c.suit === briscolaCard.suit;

        if (isBriscola(second.card) && !isBriscola(first.card)) {
            winnerOwner = second.owner;
        } else if (!isBriscola(second.card) && isBriscola(first.card)) {
            winnerOwner = first.owner;
        } else if (isBriscola(second.card) && isBriscola(first.card)) {
            if (second.card.power > first.card.power) winnerOwner = second.owner;
            else winnerOwner = first.owner;
        } else {
            if (second.card.suit === first.card.suit) {
                if (second.card.power > first.card.power) winnerOwner = second.owner;
                else winnerOwner = first.owner;
            } else {
                winnerOwner = first.owner;
            }
        }

        // Kartu diam dulu di meja selama 2.2 detik agar pemain sempat melihatnya
        setTimeout(() => {
            if (winnerOwner === 'player') {
                playerPile.push(first.card, second.card);
                
                const banner = document.getElementById('you-won-banner');
                banner.classList.add('show');
                setTimeout(() => {
                    banner.classList.remove('show');
                }, 1200);

            } else {
                aiPile.push(first.card, second.card);
            }

            // Setelah jeda selesai, picu animasi efek "kesedot & memudar"
            playedThisTurn.forEach((item, index) => {
                setTimeout(() => {
                    item.element.classList.add('throw-to-corner');
                }, index * 100);
            });

            setMessage("");

            setTimeout(() => {
                playedThisTurn.forEach(item => item.element.remove());
                playedThisTurn = [];
                currentTurnNumber++;
                afterTurnDraw(winnerOwner);
            }, 700);

        }, 2200);
    }

    function afterTurnDraw(winner) {
        if (deck.length > 0) {
            if (winner === 'player') {
                playerHand.push(deck.pop());
                if (deck.length > 0) aiHand.push(deck.pop());
            } else {
                aiHand.push(deck.pop());
                if (deck.length > 0) playerHand.push(deck.pop());
            }
        }

        updateUI();

        if (playerHand.length === 0 && aiHand.length === 0) {
            endGame();
            return;
        }

        if (winner === 'player') {
            isPlayerTurn = true;
            setMessage("Giliranmu");
        } else {
            isPlayerTurn = false;
            setMessage("");
            setTimeout(runAITurn, 1000);
        }
    }

    function setMessage(msg) {
        document.getElementById('message-box').innerText = msg;
    }

    // PENYESUAIAN UTAMA: Perhitungan skor akhir yang ketat sesuai aturan baku Briscola
    function endGame() {
        document.getElementById('score-modal').style.display = 'flex';
        
        const pTotalPts = playerPile.reduce((a, c) => a + c.points, 0);
        const aiTotalPts = aiPile.reduce((a, c) => a + c.points, 0);

        let winnerText = "";
        
        // Aturan Resmi Briscola: Pemenang ditentukan dari total poin (Maks 120 poin).
        // Menang jika mendapat > 60 poin (minimal 61 poin). Jika 60-60 maka Draw.
        if (pTotalPts > 60 && pTotalPts > aiTotalPts) {
            winnerText = "🏆 Anda Memenangkan Permainan!";
        } else if (aiTotalPts > 60 && aiTotalPts > pTotalPts) {
            winnerText = "🤖 Lawan Memenangkan Permainan!";
        } else if (pTotalPts === aiTotalPts || pTotalPts === 60) {
            winnerText = "🤝 Permainan Seri (Draw)!";
        } else {
            // Pengaman logika jika total tidak pas 120 akibat anomali minor
            if (pTotalPts > aiTotalPts) {
                winnerText = "🏆 Anda Memenangkan Permainan!";
            } else if (aiTotalPts > pTotalPts) {
                winnerText = "🤖 Lawan Memenangkan Permainan!";
            } else {
                winnerText = "🤝 Permainan Seri (Draw)!";
            }
        }

        let details = `
            <b>${winnerText}</b><br><br>
            • Poin Total Anda: <b>${pTotalPts}</b> Poin<br>
            • Poin Total Lawan: <b>${aiTotalPts}</b> Poin<br>
            <span style="font-size: 10px; color: #aaa; display:block; margin-top:8px;">*Total poin maksimal dalam 1 dek adalah 120 poin. Dibutuhkan minimal 61 poin untuk menang mutlak.</span>
        `;
        document.getElementById('score-details').innerHTML = details;
    }

    initGame();
</script>
